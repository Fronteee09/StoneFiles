<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoneFiles — Options</title>
  <link rel="icon" type="image/png" href="stonefilelogo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#18202d">

  <style>
    @font-face {
      font-family: 'Minecraft';
      src: url('Minecraft.ttf') format('truetype');
    }

    :root {
      --site-font: 'Minecraft', monospace, sans-serif;
      --site-bg: url('sfondoindex.png');
      --bg-brightness: 0.65;
      --bg-blur: 0px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0px !important;
      font-family: var(--site-font);
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, var(--bg-brightness)), rgba(0, 0, 0, var(--bg-brightness))), var(--site-bg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      backdrop-filter: blur(var(--bg-blur));
      -webkit-backdrop-filter: blur(var(--bg-blur));
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .options-container {
      background-color: rgba(24, 24, 24, 0.94);
      border: 2px solid #3a3a3a;
      max-width: 600px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .page-title {
      font-size: 1.6rem;
      color: #ffffff;
      margin-bottom: 8px;
      text-shadow: 2px 2px 0px #000000;
    }

    .sync-status {
      font-size: 0.8rem;
      color: #888888;
      margin-bottom: 18px;
    }

    .section-label {
      font-size: 0.95rem;
      color: #aaaaaa;
      text-align: left;
      margin-bottom: 8px;
      margin-top: 18px;
    }

    .mc-btn {
      display: block;
      width: 100%;
      background-color: #363636;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 16px;
      font-size: 0.95rem;
      border-top: 2px solid #5a5a5a;
      border-left: 2px solid #5a5a5a;
      border-right: 2px solid #1e1e1e;
      border-bottom: 2px solid #1e1e1e;
      text-shadow: 2px 2px 0px #1a1a1a;
      cursor: pointer;
    }

    .mc-btn:hover {
      background-color: #4a5a75;
      border-top-color: #7c92b8;
      border-left-color: #7c92b8;
      color: #ffffa0;
    }

    .slider-container {
      background-color: #1e1e1e;
      border: 1px solid #444;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .slider-container label {
      font-size: 0.85rem;
      color: #ccc;
    }

    .slider-container input[type="range"] {
      width: 100%;
      accent-color: #5a5a5a;
      cursor: pointer;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #1e1e1e;
      border: 1px solid #444;
      padding: 12px;
      cursor: pointer;
      text-align: left;
      font-size: 0.9rem;
    }

    .checkbox-container input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .bg-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 10px;
      max-height: 240px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .bg-option {
      background-color: #262626;
      border: 2px solid #444444;
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .bg-option:hover {
      border-color: #888888;
      background-color: #323232;
    }

    .bg-option.active {
      border-color: #ffff55;
      background-color: #3a3a28;
    }

    .bg-preview {
      width: 100%;
      height: 55px;
      object-fit: cover;
      border: 1px solid #111;
    }

    .bg-name {
      font-size: 0.8rem;
      color: #ffffff;
    }

    .bg-option.active .bg-name {
      color: #ffff55;
    }

    .done-btn {
      margin-top: 16px;
    }
  </style>

  <!-- FIREBASE & OPTIONS LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDuu5Y88zLYuPWqxHs9pis6OfeNDKoG8YE",
      authDomain: "stonefiles-c2a40.firebaseapp.com",
      projectId: "stonefiles-c2a40",
      storageBucket: "stonefiles-c2a40.firebasestorage.app",
      messagingSenderId: "855521046414",
      appId: "1:855521046414:web:2996e4c8f2a6b47a72fedf",
      measurementId: "G-WEFNP7N7DG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const fontBtn = document.getElementById('toggle-font-btn');
    const bgOptions = document.querySelectorAll('.bg-option');
    const syncStatus = document.getElementById('sync-status');
    const brightnessSlider = document.getElementById('brightness-slider');
    const brightnessVal = document.getElementById('brightness-val');
    const blurCheck = document.getElementById('blur-check');

    let currentUser = null;
    let currentFont = localStorage.getItem('sf_font') || 'Minecraft';
    let currentBg = localStorage.getItem('sf_bg') || 'sfondoindex.png';
    let currentBrightness = localStorage.getItem('sf_brightness') || '0.65';
    let currentBlur = localStorage.getItem('sf_blur') === 'true';

    function applyUI() {
      // Font
      if (currentFont === 'Arial') {
        document.documentElement.style.setProperty('--site-font', 'Arial, Helvetica, sans-serif');
        fontBtn.textContent = 'Font: Arial';
      } else {
        document.documentElement.style.setProperty('--site-font', "'Minecraft', monospace, sans-serif");
        fontBtn.textContent = 'Font: Minecraft';
      }

      // Sfondo
      document.documentElement.style.setProperty('--site-bg', `url('${currentBg}')`);

      // Luminosità
      document.documentElement.style.setProperty('--bg-brightness', currentBrightness);
      brightnessSlider.value = currentBrightness;
      brightnessVal.textContent = Math.round((1 - currentBrightness) * 100) + '% Dark overlay';

      // Blur
      const blurValue = currentBlur ? '6px' : '0px';
      document.documentElement.style.setProperty('--bg-blur', blurValue);
      blurCheck.checked = currentBlur;

      // Selezione visiva griglia sfondi
      bgOptions.forEach(opt => {
        if (opt.dataset.bg === currentBg) {
          opt.classList.add('active');
        } else {
          opt.classList.remove('active');
        }
      });
    }

    async function saveSettings() {
      localStorage.setItem('sf_font', currentFont);
      localStorage.setItem('sf_bg', currentBg);
      localStorage.setItem('sf_brightness', currentBrightness);
      localStorage.setItem('sf_blur', currentBlur);
      applyUI();

      if (currentUser) {
        syncStatus.textContent = "Saving to account...";
        syncStatus.style.color = "#ffff55";
        try {
          await setDoc(doc(db, "userSettings", currentUser.uid), {
            font: currentFont,
            background: currentBg,
            brightness: currentBrightness,
            blur: currentBlur
          }, { merge: true });
          syncStatus.textContent = `Synced with ${currentUser.displayName || "Account"} ✓`;
          syncStatus.style.color = "#55ff55";
        } catch (err) {
          console.error("Error saving settings:", err);
          syncStatus.textContent = "Saved locally (Sync error)";
          syncStatus.style.color = "#ff5555";
        }
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        syncStatus.textContent = `Loading settings for ${user.displayName || "Account"}...`;
        try {
          const snap = await getDoc(doc(db, "userSettings", user.uid));
          if (snap.exists()) {
            const data = snap.data();
            if (data.font) currentFont = data.font;
            if (data.background) currentBg = data.background;
            if (data.brightness !== undefined) currentBrightness = data.brightness;
            if (data.blur !== undefined) currentBlur = data.blur;

            localStorage.setItem('sf_font', currentFont);
            localStorage.setItem('sf_bg', currentBg);
            localStorage.setItem('sf_brightness', currentBrightness);
            localStorage.setItem('sf_blur', currentBlur);
            applyUI();
          }
          syncStatus.textContent = `Synced with ${user.displayName || "Account"} ✓`;
          syncStatus.style.color = "#55ff55";
        } catch (e) {
          syncStatus.textContent = "Local mode";
        }
      } else {
        currentUser = null;
        syncStatus.textContent = "Not logged in (Saved on this device only)";
        syncStatus.style.color = "#aaaaaa";
      }
    });

    fontBtn.addEventListener('click', () => {
      currentFont = (currentFont === 'Minecraft') ? 'Arial' : 'Minecraft';
      saveSettings();
    });

    bgOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        currentBg = opt.dataset.bg;
        saveSettings();
      });
    });

    brightnessSlider.addEventListener('input', (e) => {
      currentBrightness = e.target.value;
      saveSettings();
    });

    blurCheck.addEventListener('change', (e) => {
      currentBlur = e.target.checked;
      saveSettings();
    });

    applyUI();
  </script>
</head>
<body>

  <main class="options-container">
    <h1 class="page-title">Options</h1>
    <p id="sync-status" class="sync-status">Checking account...</p>

    <!-- FONT -->
    <p class="section-label">Font Style:</p>
    <button id="toggle-font-btn" class="mc-btn">Font: Minecraft</button>

    <!-- SFONDO -->
    <p class="section-label">Background Panorama:</p>
    <div class="bg-grid" id="bg-grid">
      <div class="bg-option" data-bg="sfondoindex.png">
        <img src="sfondoindex.png" alt="Sfondo Index" class="bg-preview">
        <span class="bg-name">Default (Index)</span>
      </div>
      <div class="bg-option" data-bg="titlescreen.png">
        <img src="titlescreen.png" alt="Title Screen" class="bg-preview">
        <span class="bg-name">Title Screen</span>
      </div>
      <div class="bg-option" data-bg="herobrine.png">
        <img src="herobrine.png" alt="Herobrine" class="bg-preview">
        <span class="bg-name">Herobrine</span>
      </div>
      <div class="bg-option" data-bg="wood.png">
        <img src="wood.png" alt="Wood" class="bg-preview">
        <span class="bg-name">Wood</span>
      </div>
      <div class="bg-option" data-bg="desert.png">
        <img src="desert.png" alt="Desert" class="bg-preview">
        <span class="bg-name">Desert</span>
      </div>
      <div class="bg-option" data-bg="village.png">
        <img src="village.png" alt="Village" class="bg-preview">
        <span class="bg-name">Village</span>
      </div>
      <div class="bg-option" data-bg="cave.png">
        <img src="cave.png" alt="Cave" class="bg-preview">
        <span class="bg-name">Cave</span>
      </div>
      <div class="bg-option" data-bg="island1.png">
        <img src="island1.png" alt="Island 1" class="bg-preview">
        <span class="bg-name">Island 1</span>
      </div>
      <div class="bg-option" data-bg="island2.png">
        <img src="island2.png" alt="Island 2" class="bg-preview">
        <span class="bg-name">Island 2</span>
      </div>
    </div>

    <!-- LUMINOSITA' -->
    <p class="section-label">Background Darkening:</p>
    <div class="slider-container">
      <label id="brightness-val">Dark overlay</label>
      <input type="range" id="brightness-slider" min="0.1" max="0.95" step="0.05">
    </div>

    <!-- BLUR -->
    <p class="section-label">Background Effects:</p>
    <label class="checkbox-container">
      <input type="checkbox" id="blur-check">
      <span>Enable Blur Effect (Glassmorphism)</span>
    </label>

    <!-- DONE -->
    <a href="index.html" class="mc-btn done-btn">Done</a>
  </main>

</body>
</html>
