<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('sfondoindex.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 30px 16px;
    }

    /* CONTENITORE PRINCIPALE UNIFICATO */
    .main-container {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    /* HEADER BOX, CREATOR, SEARCH E POST CARD CONDIVIDONO LA STESSA LARGHEZZA AL 100% DEL CONTAINER */
    .header-box, .creator-box, .search-box, .post-card {
      background: rgba(24, 32, 45, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      width: 100%;
    }

    .header-box {
      text-align: center;
      position: relative;
      padding: 24px;
    }

    .mail-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: linear-gradient(to bottom, #ffaa00, #e69500);
      color: #111;
      border: none;
      padding: 6px 14px;
      font-weight: bold;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      display: none;
    }

    .mail-btn:hover {
      filter: brightness(1.1);
    }

    .header-box h1 {
      font-size: 2rem;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .header-box p {
      font-size: 0.9rem;
      color: #b0c4de;
      margin-bottom: 16px;
    }

    .btn-gold {
      background: linear-gradient(to bottom, #f39c12, #d35400);
      color: #ffffff;
      border: none;
      padding: 8px 20px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .btn-gold:hover {
      filter: brightness(1.1);
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #ffffff;
      padding: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      margin-bottom: 12px;
    }

    .form-input:focus {
      outline: none;
      border-color: #3498db;
      background: rgba(255, 255, 255, 0.1);
    }

    textarea.form-input {
      resize: vertical;
      min-height: 90px;
    }

    .btn-publish {
      background: linear-gradient(to bottom, #3498db, #2980b9);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      font-size: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .btn-publish:hover {
      filter: brightness(1.1);
    }

    .search-box {
      padding: 12px 20px;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input::placeholder {
      color: #8899a6;
    }

    .post-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .post-meta {
      font-size: 0.8rem;
      color: #8899a6;
      display: flex;
      justify-content: space-between;
    }

    .post-title {
      font-size: 1.2rem;
      color: #ffffff;
      font-weight: bold;
      word-break: break-word;
    }

    .post-text {
      font-size: 0.95rem;
      color: #d0d0d0;
      white-space: pre-wrap;
      line-height: 1.4;
      word-break: break-word;
    }

    .post-media {
      max-width: 100%;
      border-radius: 6px;
      margin-top: 8px;
      max-height: 350px;
      object-fit: contain;
    }

    .post-footer {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #b0c4de;
      padding: 6px 14px;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .btn-delete {
      background: rgba(231, 76, 60, 0.2);
      border-color: rgba(231, 76, 60, 0.4);
      color: #e74c3c;
    }

    /* ADMIN MODAL */
    #admin-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #18202d;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    .close-modal {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }
  </style>
