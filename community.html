<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoneFiles — Community</title>
  <link rel="icon" type="image/png" href="stonefilelogo.png">
  
  <style>
    /* RESET BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0px !important;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('sfondoindex.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px 16px;
    }

    /* BARRA IN ALTO */
    .top-bar {
      max-width: 650px;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-back {
      background-color: #1e1e1e;
      color: #ffffff;
      border: 1px solid #444444;
      padding: 6px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }

    .btn-back:hover {
      background-color: #2e2e2e;
    }

    .user-status {
      font-size: 0.85rem;
      color: #aaaaaa;
    }

    /* CONTENITORE PRINCIPALE */
    .main-container {
      max-width: 650px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* BOX CREAZIONE POST / PANNELLO ADMIN */
    .post-creator-box, .admin-panel {
      background-color: rgba(30, 30, 30, 0.95);
      border: 1px solid #333333;
      padding: 24px;
    }

    .post-creator-box h2, .admin-panel h2 {
      font-size: 1.2rem;
      color: #ffffff;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      background-color: #181818;
      border: 1px solid #444444;
      color: #ffffff;
      padding: 10px;
      font-size: 0.9rem;
      font-family: inherit;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: #777777;
    }

    .btn-publish {
      background-color: #3a3a3a;
      color: #ffffff;
      border: 1px solid #555555;
      padding: 8px 20px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-publish:hover {
      background-color: #4a4a4a;
    }

    /* FEED DEI POST */
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .post-card {
      background-color: rgba(30, 30, 30, 0.95);
      border: 1px solid #333333;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .post-header {
      font-size: 0.8rem;
      color: #888888;
      display: flex;
      justify-content: space-between;
    }

    .post-title {
      font-size: 1.1rem;
      color: #ffffff;
      font-weight: bold;
    }

    .post-body {
      font-size: 0.9rem;
      color: #cccccc;
      white-space: pre-wrap;
    }

    .post-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #2a2a2a;
    }

    .btn-action {
      background-color: #252525;
      color: #bbbbbb;
      border: 1px solid #3a3a3a;
      padding: 5px 12px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-action:hover {
      background-color: #333333;
      color: #ffffff;
    }

    .btn-report {
      color: #ff6b6b;
    }

    .btn-delete {
      background-color: #5a1a1a;
      border-color: #ff4444;
      color: #ff4444;
    }
  </style>

  <!-- FIREBASE & ADMIN LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDuu5Y88zLYuPWqxHs9pis6OfeNDKoG8YE",
      authDomain: "stonefiles-c2a40.firebaseapp.com",
      projectId: "stonefiles-c2a40",
      storageBucket: "stonefiles-c2a40.firebasestorage.app",
      messagingSenderId: "855521046414",
      appId: "1:855521046414:web:2996e4c8f2a6b47a72fedf",
      measurementId: "G-WEFNP7N7DG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_NICKNAME = "Fronte ★";

    document.addEventListener("DOMContentLoaded", () => {
      const userStatusEl = document.getElementById("user-status");
      const postForm = document.getElementById("post-form");
      const postsFeed = document.getElementById("posts-feed");
      const adminPanel = document.getElementById("admin-panel");
      const reportsList = document.getElementById("reports-list");

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          const nickname = user.displayName || "Utente";
          userStatusEl.textContent = `Logged as: ${nickname}`;

          if (nickname === ADMIN_NICKNAME) {
            adminPanel.style.display = "block";
            loadReports();
          } else {
            adminPanel.style.display = "none";
          }
        } else {
          userStatusEl.innerHTML = `<a href="account.html" style="color: #ff6b6b;">Accedi per postare</a>`;
          adminPanel.style.display = "none";
        }
      });

      // Pubblicazione post
      postForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const user = auth.currentUser;
        if (!user) {
          alert("Devi effettuare l'accesso!");
          window.location.href = "account.html";
          return;
        }

        const title = document.getElementById("post-title-input").value.trim();
        const body = document.getElementById("post-body-input").value.trim();
        const nickname = user.displayName || "Anonym";

        if (!title || !body) return;

        try {
          await addDoc(collection(db, "posts"), {
            title,
            body,
            author: nickname,
            likes: 0,
            createdAt: serverTimestamp()
          });

          document.getElementById("post-title-input").value = "";
          document.getElementById("post-body-input").value = "";
          loadPosts();
        } catch (error) {
          console.error("Errore invio post:", error);
        }
      });

      // Caricamento dei post
      async function loadPosts() {
        postsFeed.innerHTML = "<p style='color: #888;'>Caricamento post...</p>";
        try {
          const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
          const querySnapshot = await getDocs(q);
          
          postsFeed.innerHTML = "";
          if (querySnapshot.empty) {
            postsFeed.innerHTML = "<p style='color: #888;'>Nessun post nella community.</p>";
            return;
          }

          const currentUser = auth.currentUser;
          const isUserAdmin = currentUser && currentUser.displayName === ADMIN_NICKNAME;

          querySnapshot.forEach((documentSnapshot) => {
            const post = documentSnapshot.data();
            const postId = documentSnapshot.id;

            const card = document.createElement("article");
            card.className = "post-card";
            card.innerHTML = `
              <div class="post-header">
                <span>Posted by u/${post.author || "Anonym"}</span>
              </div>
              <h3 class="post-title">${escapeHtml(post.title)}</h3>
              <p class="post-body">${escapeHtml(post.body)}</p>
              <div class="post-actions">
                <button class="btn-action like-btn" data-id="${postId}">▲ ${post.likes || 0} Likes</button>
                <button class="btn-action btn-report report-btn" data-id="${postId}">Report</button>
                ${isUserAdmin ? `<button class="btn-action btn-delete delete-btn" data-id="${postId}">Elimina (Admin)</button>` : ""}
              </div>
            `;

            card.querySelector(".like-btn").addEventListener("click", async () => {
              await updateDoc(doc(db, "posts", postId), { likes: increment(1) });
              loadPosts();
            });

            card.querySelector(".report-btn").addEventListener("click", async () => {
              try {
                await addDoc(collection(db, "reports"), {
                  postId: postId,
                  postTitle: post.title,
                  author: post.author,
                  reportedAt: serverTimestamp()
                });
                alert("Post segnalato con successo a Fronte ★.");
              } catch (err) {
                console.error("Errore report:", err);
              }
            });

            if (isUserAdmin) {
              card.querySelector(".delete-btn").addEventListener("click", async () => {
                if (confirm("Vuoi eliminare questo post?")) {
                  await deleteDoc(doc(db, "posts", postId));
                  loadPosts();
                  loadReports();
                }
              });
            }

            postsFeed.appendChild(card);
          });
        } catch (err) {
          console.error("Errore caricamento feed:", err);
        }
      }

      async function loadReports() {
        try {
          const q = query(collection(db, "reports"), orderBy("reportedAt", "desc"));
          const querySnapshot = await getDocs(q);
          reportsList.innerHTML = "";

          if (querySnapshot.empty) {
            reportsList.innerHTML = "<p style='color: #888; font-size: 0.85rem;'>Nessuna segnalazione ricevuta.</p>";
            return;
          }

          querySnapshot.forEach((docSnap) => {
            const rep = docSnap.data();
            const div = document.createElement("div");
            div.style.cssText = "background: #181818; border: 1px solid #444; padding: 10px; margin-bottom: 8px; font-size: 0.85rem;";
            div.innerHTML = `
              <strong>Post:</strong> "${escapeHtml(rep.postTitle || 'Senza titolo')}" <br>
              <strong>Autore:</strong> u/${rep.author} <br>
              <button class="btn-action btn-delete" style="margin-top: 6px;" onclick="window.deleteReport('${docSnap.id}')">Rimuovi Segnalazione</button>
            `;
            reportsList.appendChild(div);
          });
        } catch (err) {
          console.error("Errore caricamento report:", err);
        }
      }

      window.deleteReport = async function(reportId) {
        await deleteDoc(doc(db, "reports", reportId));
        loadReports();
      };

      function escapeHtml(text) {
        return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
      }

      loadPosts();
    });
  </script>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="btn-back">← Home</a>
    <span id="user-status" class="user-status">Verifica accesso...</span>
  </div>

  <div class="main-container">

    <!-- PANNELLO DI CONTROLLO RISERVATO A FRONTE ★ -->
    <section id="admin-panel" class="admin-panel" style="display: none;">
      <h2>Pannello di Controllo (Fronte ★)</h2>
      <p style="font-size: 0.85rem; color: #ffaa00; margin-bottom: 12px;">Sei loggato come Admin. Qui vedi le segnalazioni (Report) dei post:</p>
      <div id="reports-list">
        <p style="color: #888; font-size: 0.85rem;">Caricamento segnalazioni...</p>
      </div>
    </section>

    <!-- BOX CREAZIONE POST -->
    <section class="post-creator-box">
      <h2>Crea un nuovo post</h2>
      <form id="post-form">
        <div class="form-group">
          <input type="text" id="post-title-input" placeholder="Titolo del post..." required />
        </div>
        <div class="form-group">
          <textarea id="post-body-input" placeholder="Scrivi il corpo del post..." required></textarea>
        </div>
        <button type="submit" class="btn-publish">Pubblica</button>
      </form>
    </section>

    <!-- FEED DEI POST -->
    <section class="feed-container" id="posts-feed">
      <!-- I post caricati da Firebase appariranno qui -->
    </section>

  </div>

</body>
</html>
