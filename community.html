<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoneFiles — Community</title>
  <link rel="icon" type="image/png" href="stonefilelogo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#18202d">
  <script type="module" src="theme.js"></script>
  
  <style>
    @font-face {
      font-family: 'Minecraft';
      src: url('Minecraft.ttf') format('truetype');
    }

    /* STILE SQUADRATO MINECRAFT-STYLE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0px !important;
      font-family: 'Minecraft', monospace, sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('sfondoindex.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 30px 16px;
    }

    .main-container {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    /* TUTTI I BOX CONDIVIDONO LA STESSA LARGHEZZA E BORDI SQUADRATI */
    .header-box, .creator-box, .search-box, .post-card {
      background-color: rgba(24, 24, 24, 0.94);
      border-top: 2px solid #5a5a5a;
      border-left: 2px solid #5a5a5a;
      border-right: 2px solid #1e1e1e;
      border-bottom: 2px solid #1e1e1e;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      width: 100%;
    }

    .header-box {
      text-align: center;
      position: relative;
      padding: 24px;
    }

    .mail-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background-color: #363636;
      color: #ffaa00;
      border-top: 2px solid #5a5a5a;
      border-left: 2px solid #5a5a5a;
      border-right: 2px solid #1e1e1e;
      border-bottom: 2px solid #1e1e1e;
      padding: 6px 12px;
      font-weight: bold;
      font-size: 0.85rem;
      text-shadow: 2px 2px 0px #1a1a1a;
      cursor: pointer;
      display: none;
    }

    .mail-btn:hover {
      background-color: #4a5a75;
      color: #ffffa0;
    }

    .header-box h1 {
      font-size: 1.9rem;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-shadow: 3px 3px 0px #000000;
    }

    .header-box p {
      font-size: 0.9rem;
      color: #aaaaaa;
      margin-bottom: 18px;
    }

    /* BOTTONI IN STILE MENU MINECRAFT */
    .mc-btn {
      background-color: #363636;
      color: #ffffff;
      border-top: 2px solid #5a5a5a;
      border-left: 2px solid #5a5a5a;
      border-right: 2px solid #1e1e1e;
      border-bottom: 2px solid #1e1e1e;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-shadow: 2px 2px 0px #1a1a1a;
    }

    .mc-btn:hover {
      background-color: #4a5a75;
      border-top-color: #7c92b8;
      border-left-color: #7c92b8;
      color: #ffffa0;
    }

    .mc-btn:active {
      border-top: 2px solid #1e1e1e;
      border-left: 2px solid #1e1e1e;
      border-right: 2px solid #5a5a5a;
      border-bottom: 2px solid #5a5a5a;
    }

    .btn-gold {
      color: #ffaa00;
    }

    .form-input {
      width: 100%;
      background-color: #121212;
      border: 2px solid #444444;
      color: #ffffff;
      padding: 12px;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .form-input:focus {
      outline: none;
      border-color: #888888;
      background-color: #181818;
    }

    textarea.form-input {
      resize: vertical;
      min-height: 90px;
    }

    .search-box {
      padding: 12px 16px;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input::placeholder {
      color: #777777;
    }

    .post-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .post-meta {
      font-size: 0.8rem;
      color: #888888;
      display: flex;
      justify-content: space-between;
    }

    .post-title {
      font-size: 1.2rem;
      color: #ffffff;
      font-weight: bold;
      text-shadow: 2px 2px 0px #000000;
      word-break: break-word;
    }

    .post-text {
      font-size: 0.95rem;
      color: #cccccc;
      white-space: pre-wrap;
      line-height: 1.45;
      word-break: break-word;
    }

    .post-media {
      max-width: 100%;
      margin-top: 8px;
      max-height: 350px;
      object-fit: contain;
      border: 2px solid #3a3a3a;
    }

    .post-footer {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      padding-top: 12px;
      border-top: 2px solid #2e2e2e;
    }

    .action-btn {
      background-color: #2c2c2c;
      border-top: 2px solid #4a4a4a;
      border-left: 2px solid #4a4a4a;
      border-right: 2px solid #181818;
      border-bottom: 2px solid #181818;
      color: #dddddd;
      padding: 6px 14px;
      font-size: 0.85rem;
      text-shadow: 1px 1px 0px #000;
      cursor: pointer;
    }

    .action-btn:hover {
      background-color: #4a5a75;
      color: #ffffa0;
    }

    .btn-delete {
      background-color: #4a1a1a;
      border-top-color: #7a2a2a;
      border-left-color: #7a2a2a;
      border-right-color: #2a0a0a;
      border-bottom-color: #2a0a0a;
      color: #ff6666;
    }

    .btn-delete:hover {
      background-color: #6a2222;
      color: #ffffff;
    }

    /* ADMIN MODAL */
    #admin-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background-color: #181818;
      border-top: 2px solid #5a5a5a;
      border-left: 2px solid #5a5a5a;
      border-right: 2px solid #1e1e1e;
      border-bottom: 2px solid #1e1e1e;
      width: 90%;
      max-width: 500px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 2px solid #333333;
      padding-bottom: 10px;
    }

    .close-modal {
      background-color: #363636;
      border: 2px solid #5a5a5a;
      color: #ffffff;
      font-size: 1.1rem;
      padding: 2px 8px;
      cursor: pointer;
    }

    .close-modal:hover {
      background-color: #4a5a75;
      color: #ffffa0;
    }
  </style>

  <!-- FIREBASE LOGIC -->
  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, updateDoc, deleteDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDuu5Y88zLYuPWqxHs9pis6OfeNDKoG8YE",
      authDomain: "stonefiles-c2a40.firebaseapp.com",
      projectId: "stonefiles-c2a40",
      storageBucket: "stonefiles-c2a40.firebasestorage.app",
      messagingSenderId: "855521046414",
      appId: "1:855521046414:web:2996e4c8f2a6b47a72fedf",
      measurementId: "G-WEFNP7N7DG"
    };

    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_NICKNAME = "Fronte ★";
    const ADMIN_UID = "rgXLYIPZcgTYqJWYmz6y4bmZCdJ3";

    document.addEventListener("DOMContentLoaded", () => {
      const mailBtn = document.getElementById("mail-btn");
      const postForm = document.getElementById("post-form");
      const postsFeed = document.getElementById("posts-feed");
      const mediaInputGroup = document.getElementById("media-input-group");
      const adminModal = document.getElementById("admin-modal");
      const reportsList = document.getElementById("reports-list");
      const closeModal = document.getElementById("close-modal");
      const searchInput = document.getElementById("search-input");

      let allPosts = [];

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          const nickname = user.displayName || "User";
          // Controllo permessi tramite Nickname oppure UID specifico
          if (nickname === ADMIN_NICKNAME || user.uid === ADMIN_UID) {
            mailBtn.style.display = "block";
            if (mediaInputGroup) mediaInputGroup.style.display = "block";
            loadReportsCount();
          }
        }
        loadPosts();
      });

      mailBtn.addEventListener("click", () => {
        adminModal.style.display = "flex";
        loadReports();
      });
      closeModal.addEventListener("click", () => adminModal.style.display = "none");

      postForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const user = auth.currentUser;
        if (!user) {
          alert("You must log in to post!");
          window.location.href = "account.html";
          return;
        }

        const title = document.getElementById("post-title-input").value.trim();
        const body = document.getElementById("post-body-input").value.trim();
        const mediaInputEl = document.getElementById("post-media-input");
        const mediaUrl = mediaInputEl ? mediaInputEl.value.trim() : "";
        const nickname = user.displayName || "Anonym";
        const isMod = (nickname === ADMIN_NICKNAME || user.uid === ADMIN_UID);

        if (!title || !body) return;

        try {
          await addDoc(collection(db, "posts"), {
            title,
            body,
            mediaUrl: isMod ? mediaUrl : "",
            author: nickname,
            likes: 0,
            createdAt: serverTimestamp()
          });

          postForm.reset();
          loadPosts();
        } catch (error) {
          console.error("Error publishing post:", error);
          alert("Error publishing post.");
        }
      });

      async function loadPosts() {
        postsFeed.innerHTML = "<p style='color: #888888; text-align:center;'>Loading posts...</p>";
        try {
          const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
          const querySnapshot = await getDocs(q);
          
          allPosts = [];
          querySnapshot.forEach((docSnap) => {
            allPosts.push({ id: docSnap.id, ...docSnap.data() });
          });

          renderPosts(allPosts);
        } catch (err) {
          console.error("Error loading posts:", err);
          postsFeed.innerHTML = "<p style='color: #ff5555; text-align:center;'>Error loading posts.</p>";
        }
      }

      function renderPosts(postsToRender) {
        postsFeed.innerHTML = "";
        if (postsToRender.length === 0) {
          postsFeed.innerHTML = "<p style='color: #888888; text-align:center;'>No posts found.</p>";
          return;
        }

        const currentUser = auth.currentUser;
        const isUserMod = currentUser && (currentUser.displayName === ADMIN_NICKNAME || currentUser.uid === ADMIN_UID);

        postsToRender.forEach((post) => {
          const card = document.createElement("article");
          card.className = "post-card";
          
          let mediaHTML = "";
          if (post.mediaUrl) {
            if (post.mediaUrl.endsWith(".mp4") || post.mediaUrl.includes("video")) {
              mediaHTML = `<video src="${post.mediaUrl}" controls class="post-media"></video>`;
            } else {
              mediaHTML = `<img src="${post.mediaUrl}" alt="Media" class="post-media" />`;
            }
          }

          card.innerHTML = `
            <div class="post-meta">
              <span>u/${escapeHtml(post.author || "Anonym")}</span>
            </div>
            <h3 class="post-title">${escapeHtml(post.title)}</h3>
            <p class="post-text">${escapeHtml(post.body)}</p>
            ${mediaHTML}
            <div class="post-footer">
              <button class="action-btn like-btn" data-id="${post.id}">▲ ${post.likes || 0}</button>
              <button class="action-btn report-btn" data-id="${post.id}">Report</button>
              ${isUserMod ? `<button class="action-btn btn-delete delete-btn" data-id="${post.id}">Delete</button>` : ""}
            </div>
          `;

          card.querySelector(".like-btn").addEventListener("click", async () => {
            await updateDoc(doc(db, "posts", post.id), { likes: increment(1) });
            loadPosts();
          });

          card.querySelector(".report-btn").addEventListener("click", async () => {
            await addDoc(collection(db, "reports"), {
              postId: post.id,
              postTitle: post.title,
              author: post.author,
              reportedAt: serverTimestamp()
            });
            alert("Post reported to moderators.");
            loadReportsCount();
          });

          if (isUserMod) {
            card.querySelector(".delete-btn").addEventListener("click", async () => {
              if (confirm("Do you want to delete this post?")) {
                await deleteDoc(doc(db, "posts", post.id));
                loadPosts();
                loadReportsCount();
              }
            });
          }

          postsFeed.appendChild(card);
        });
      }

      searchInput.addEventListener("input", (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allPosts.filter(p => 
          p.title.toLowerCase().includes(term) || p.body.toLowerCase().includes(term)
        );
        renderPosts(filtered);
      });

      async function loadReportsCount() {
        try {
          const snapshot = await getDocs(collection(db, "reports"));
          mailBtn.textContent = `✉ Mail (${snapshot.size})`;
        } catch(e) {}
      }

      async function loadReports() {
        try {
          const q = query(collection(db, "reports"), orderBy("reportedAt", "desc"));
          const snapshot = await getDocs(q);
          reportsList.innerHTML = "";

          if (snapshot.empty) {
            reportsList.innerHTML = "<p style='color: #888888; font-size: 0.9rem;'>No reports received.</p>";
            return;
          }

          snapshot.forEach((docSnap) => {
            const rep = docSnap.data();
            const div = document.createElement("div");
            div.style.cssText = "background: #121212; border: 2px solid #3a3a3a; padding: 12px; margin-bottom: 10px; font-size: 0.85rem;";
            div.innerHTML = `
              <strong>Post:</strong> "${escapeHtml(rep.postTitle)}" <br>
              <strong>Author:</strong> u/${escapeHtml(rep.author)} <br>
              <button class="action-btn btn-delete" style="margin-top: 8px;" onclick="window.resolveReport('${docSnap.id}', '${rep.postId}')">Delete Post & Remove Report</button>
            `;
            reportsList.appendChild(div);
          });
        } catch (err) {
          console.error("Error loading reports:", err);
        }
      }

      window.resolveReport = async function(reportId, postId) {
        if (confirm("Do you want to delete the reported post and clear this report?")) {
          try {
            await deleteDoc(doc(db, "posts", postId));
          } catch(e) {}
          await deleteDoc(doc(db, "reports", reportId));
          loadReports();
          loadPosts();
          loadReportsCount();
        }
      };

      function escapeHtml(text) {
        return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
      }
    });
  </script>
</head>
<body>

  <div class="main-container">

    <!-- HEADER -->
    <header class="header-box">
      <button id="mail-btn" class="mail-btn">✉ Mail (0)</button>
      <h1>Minecraft Community</h1>
      <p>Share ideas, builds, and comments with other gamers.</p>
      <a href="index.html" class="mc-btn btn-gold">← Main Menu</a>
    </header>

    <!-- POST CREATOR -->
    <section class="creator-box">
      <form id="post-form">
        <input type="text" id="post-title-input" class="form-input" placeholder="Post title..." required />
        <textarea id="post-body-input" class="form-input" placeholder="Write your message..." required></textarea>
        
        <div id="media-input-group" style="display: none;">
          <input type="text" id="post-media-input" class="form-input" placeholder="Image or .mp4 Video URL (Moderators only)" />
        </div>

        <button type="submit" class="mc-btn">Publish Post</button>
      </form>
    </section>

    <!-- SEARCH BAR -->
    <section class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="Search posts..." />
    </section>

    <!-- POSTS FEED -->
    <div id="posts-feed" style="display: flex; flex-direction: column; gap: 16px; width: 100%;">
      <!-- Dynamic posts will load here -->
    </div>

  </div>

  <!-- ADMIN MODAL -->
  <div id="admin-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="color: #fff; font-size: 1.1rem;">Received Reports (Mail)</h3>
        <button id="close-modal" class="close-modal">&times;</button>
      </div>
      <div id="reports-list">
        <p style="color: #888888; font-size: 0.9rem;">Loading...</p>
      </div>
    </div>
  </div>

</body>
</html>
