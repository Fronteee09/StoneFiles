<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoneFiles — Announcements</title>
  <link rel="icon" type="image/png" href="stonefilelogo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#18202d">
  <script type="module" src="theme.js"></script>
  
  <style>
    @font-face {
      font-family: 'Minecraft';
      src: url('Minecraft.ttf') format('truetype');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0px !important;
      font-family: 'Minecraft', monospace, sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('sfondoindex.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 30px 16px;
    }

    .main-container {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    .header-box, .creator-box, .post-card {
      background-color: rgba(24, 24, 24, 0.94);
      border-top: 2px solid #5a5a5a;
      border-left: 2px solid #5a5a5a;
      border-right: 2px solid #1e1e1e;
      border-bottom: 2px solid #1e1e1e;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      width: 100%;
    }

    .header-box {
      text-align: center;
      padding: 24px;
    }

    .header-box h1 {
      font-size: 1.9rem;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-shadow: 3px 3px 0px #000000;
    }

    .header-box p {
      font-size: 0.9rem;
      color: #aaaaaa;
      margin-bottom: 18px;
    }

    .mc-btn {
      background-color: #363636;
      color: #ffffff;
      border-top: 2px solid #5a5a5a;
      border-left: 2px solid #5a5a5a;
      border-right: 2px solid #1e1e1e;
      border-bottom: 2px solid #1e1e1e;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-shadow: 2px 2px 0px #1a1a1a;
    }

    .mc-btn:hover {
      background-color: #4a5a75;
      border-top-color: #7c92b8;
      border-left-color: #7c92b8;
      color: #ffffa0;
    }

    .btn-gold {
      color: #ffaa00;
    }

    .form-input {
      width: 100%;
      background-color: #121212;
      border: 2px solid #444444;
      color: #ffffff;
      padding: 12px;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .form-input:focus {
      outline: none;
      border-color: #888888;
      background-color: #181818;
    }

    textarea.form-input {
      resize: vertical;
      min-height: 90px;
    }

    .post-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-left: 4px solid #ffaa00;
    }

    .post-meta {
      font-size: 0.8rem;
      color: #ffaa00;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }

    .post-title {
      font-size: 1.2rem;
      color: #ffffff;
      font-weight: bold;
      text-shadow: 2px 2px 0px #000000;
      word-break: break-word;
    }

    .post-text {
      font-size: 0.95rem;
      color: #cccccc;
      white-space: pre-wrap;
      line-height: 1.45;
      word-break: break-word;
    }

    .post-media {
      max-width: 100%;
      margin-top: 8px;
      max-height: 350px;
      object-fit: contain;
      border: 2px solid #3a3a3a;
    }

    .post-footer {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      padding-top: 12px;
      border-top: 2px solid #2e2e2e;
    }

    .btn-delete {
      background-color: #4a1a1a;
      border-top-color: #7a2a2a;
      border-left-color: #7a2a2a;
      border-right-color: #2a0a0a;
      border-bottom-color: #2a0a0a;
      color: #ff6666;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-delete:hover {
      background-color: #6a2222;
      color: #ffffff;
    }
  </style>

  <!-- FIREBASE LOGIC -->
  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDuu5Y88zLYuPWqxHs9pis6OfeNDKoG8YE",
      authDomain: "stonefiles-c2a40.firebaseapp.com",
      projectId: "stonefiles-c2a40",
      storageBucket: "stonefiles-c2a40.firebasestorage.app",
      messagingSenderId: "855521046414",
      appId: "1:855521046414:web:2996e4c8f2a6b47a72fedf",
      measurementId: "G-WEFNP7N7DG"
    };

    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_UIDS = [
      "rgXLYIPZcgTYqJWYmz6y4bmZCdJ3",
      "5rJ0ax8MtQW6Ih64ufszdZ9qzoH3"
    ];

    function checkIsMod(user) {
      if (!user) return false;
      return ADMIN_UIDS.includes(user.uid);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const creatorBox = document.getElementById("creator-box");
      const announcementForm = document.getElementById("announcement-form");
      const announcementsFeed = document.getElementById("announcements-feed");

      onAuthStateChanged(auth, async (user) => {
        if (checkIsMod(user)) {
          creatorBox.style.display = "block";
        } else {
          creatorBox.style.display = "none";
        }
        loadAnnouncements();
      });

      announcementForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const user = auth.currentUser;
        if (!checkIsMod(user)) {
          alert("Unauthorized!");
          return;
        }

        const title = document.getElementById("ann-title-input").value.trim();
        const body = document.getElementById("ann-body-input").value.trim();
        const mediaUrl = document.getElementById("ann-media-input").value.trim();

        if (!title || !body) return;

        try {
          await addDoc(collection(db, "announcements"), {
            title,
            body,
            mediaUrl,
            author: user.displayName || "Administrator",
            createdAt: serverTimestamp()
          });

          announcementForm.reset();
          loadAnnouncements();
        } catch (error) {
          console.error("Error publishing announcement:", error);
          alert("Error publishing announcement.");
        }
      });

      async function loadAnnouncements() {
        announcementsFeed.innerHTML = "<p style='color: #888888; text-align:center;'>Loading announcements...</p>";
        try {
          const q = query(collection(db, "announcements"), orderBy("createdAt", "desc"));
          const querySnapshot =- await getDocs(q);
          
          announcementsFeed.innerHTML = "";
          if (querySnapshot.empty) {
            announcementsFeed.innerHTML = "<p style='color: #888888; text-align:center;'>No announcements yet.</p>";
            return;
          }

          const isUserMod = checkIsMod(auth.currentUser);

          querySnapshot.forEach((docSnap) => {
            const ann = { id: docSnap.id, ...docSnap.data() };
            const card = document.createElement("article");
            card.className = "post-card";
            
            let mediaHTML = "";
            if (ann.mediaUrl) {
              if (ann.mediaUrl.endsWith(".mp4") || ann.mediaUrl.includes("video")) {
                mediaHTML = `<video src="${ann.mediaUrl}" controls class="post-media"></video>`;
              } else {
                mediaHTML = `<img src="${ann.mediaUrl}" alt="Media" class="post-media" />`;
              }
            }

            card.innerHTML = `
              <div class="post-meta">
                <span>⚡ OFFICIAL ANNOUNCEMENT by u/${escapeHtml(ann.author || "Admin")}</span>
              </div>
              <h3 class="post-title">${escapeHtml(ann.title)}</h3>
              <p class="post-text">${escapeHtml(ann.body)}</p>
              ${mediaHTML}
              ${isUserMod ? `
                <div class="post-footer">
                  <button class="btn-delete delete-ann-btn" data-id="${ann.id}">Delete Announcement</button>
                </div>
              ` : ""}
            `;

            if (isUserMod) {
              card.querySelector(".delete-ann-btn").addEventListener("click", async () => {
                if (confirm("Do you want to delete this announcement?")) {
                  await deleteDoc(doc(db, "announcements", ann.id));
                  loadAnnouncements();
                }
              });
            }

            announcementsFeed.appendChild(card);
          });
        } catch (err) {
          console.error("Error loading announcements:", err);
          announcementsFeed.innerHTML = "<p style='color: #ff5555; text-align:center;'>Error loading announcements.</p>";
        }
      }

      function escapeHtml(text) {
        return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
      }
    });
  </script>
</head>
<body>

  <main class="main-container">

    <!-- HEADER -->
    <header class="header-box">
      <h1>Announcements</h1>
      <p>Official news, updates, and community notices.</p>
      <a href="index.html" class="mc-btn btn-gold">← Main Menu</a>
    </header>

    <!-- ANNOUNCEMENT CREATOR (Solo per i mod UID) -->
    <section id="creator-box" class="creator-box" style="display: none;">
      <form id="announcement-form">
        <input type="text" id="ann-title-input" class="form-input" placeholder="Announcement title..." required />
        <textarea id="ann-body-input" class="form-input" placeholder="Write official announcement..." required></textarea>
        <input type="text" id="ann-media-input" class="form-input" placeholder="Image or .mp4 Video URL (Optional)" />
        <button type="submit" class="mc-btn">Publish Announcement</button>
      </form>
    </section>

    <!-- ANNOUNCEMENTS FEED -->
    <div id="announcements-feed" style="display: flex; flex-direction: column; gap: 16px; width: 100%;">
      <!-- Dynamic announcements load here -->
    </div>

  </main>

</body>
</html>
