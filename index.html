<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoneFiles — Alpha & Beta Minecraft Hub</title>
  <meta name="description" content="The community board and archive dedicated to Minecraft's Alpha and Beta eras." />
  
  <style>
    /* RESET BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0px !important; /* Estetica quadrata retro */
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Imposta lo sfondo con l'immagine richiesta e un fallback scuro */
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('sfondoindex.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px 16px;
    }

    /* BARRA IN ALTO (LOGIN / ACCEDI) */
    .top-bar {
      max-width: 750px;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: flex-end;
    }

    .btn-login {
      background-color: #1e1e1e;
      color: #ffffff;
      border: 1px solid #444444;
      padding: 6px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-login:hover {
      background-color: #2e2e2e;
    }

    /* CONTENITORE CENTRALE */
    .main-container {
      max-width: 750px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* HERO BOX PRINCIPALE */
    .hero-box {
      background-color: rgba(30, 30, 30, 0.9); /* Leggermente trasparente per intravedere lo sfondo */
      border: 1px solid #333333;
      padding: 40px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* LOGO BLOCCO PIETRA RETRO */
    .hero-logo {
      width: 70px;
      height: 70px;
      background-color: #686868;
      border: 4px solid #888888;
      margin-bottom: 20px;
    }

    .hero-title {
      font-size: 2.2rem;
      color: #ffffff;
      margin-bottom: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .hero-description {
      font-size: 0.95rem;
      color: #aaaaaa;
      max-width: 550px;
      margin-bottom: 24px;
    }

    .hero-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }

    .btn-hero {
      background-color: #2a2a2a;
      color: #ffffff;
      border: 1px solid #444444;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-hero:hover {
      background-color: #383838;
      border-color: #666666;
    }

    .btn-hero.primary {
      background-color: #3a3a3a;
      border-color: #555555;
    }

    .btn-hero.primary:hover {
      background-color: #4a4a4a;
    }

    /* BOX SECONDARI SOTTO */
    .secondary-box {
      background-color: rgba(30, 30, 30, 0.9);
      border: 1px solid #333333;
      padding: 24px;
    }

    .secondary-box h2 {
      font-size: 1.1rem;
      color: #ffffff;
      margin-bottom: 10px;
      border-bottom: 1px solid #333333;
      padding-bottom: 8px;
    }

    .secondary-box p {
      font-size: 0.9rem;
      color: #bbbbbb;
    }
  </style>
</head>
<body>

  <!-- BOTTONE LOGIN -->
  <div class="top-bar">
    <button class="btn-login">Accedi</button>
  </div>

  <div class="main-container">

    <!-- HERO BOX CENTRALE -->
    <main class="hero-box">
      <div class="hero-logo"></div>
      <h1 class="hero-title">StoneFiles</h1>
      <p class="hero-description">
        The community board and archive dedicated to Minecraft's Alpha and Beta eras. Preserving block history since day one.
      </p>
      
      <div class="hero-buttons">
        <a href="#" class="btn-hero primary">View posts and community</a>
        <a href="#" class="btn-hero">View archive</a>
      </div>
    </main>

    <!-- BOX SOTTO PER ALTRI CONTENUTI -->
    <section class="secondary-box">
      <h2>Chi siamo</h2>
      <p>This is a place to share seeds, legacy mods, historical guides, and memories from the golden era of Minecraft.</p>
    </section>

  </div>

</body>
</html>
