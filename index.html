<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoneFiles — Alpha & Beta Minecraft Hub</title>
  <link rel="icon" type="image/png" href="stonefilelogo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#18202d">
  <script type="module" src="theme.js"></script>

  <style>
    /* IMPORTAZIONE FONT CUSTOM */
    @font-face {
      font-family: 'Minecraft';
      src: url('Minecraft.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'MineCrafter';
      src: url('MineCrafter.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* RESET BASE E FONT DEFAULT MINECRAFT */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0px !important;
      font-family: 'Minecraft', monospace, sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('sfondoindex.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    /* CONTENITORE PRINCIPALE */
    .hub-container {
      background-color: rgba(24, 24, 24, 0.94);
      border-top: 2px solid #5a5a5a;
      border-left: 2px solid #5a5a5a;
      border-right: 2px solid #1e1e1e;
      border-bottom: 2px solid #1e1e1e;
      max-width: 540px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .logo-img {
      width: 72px;
      height: 72px;
      margin-bottom: 14px;
      image-rendering: pixelated;
    }

    /* TITOLO GRANDE CON FONT MINECRAFTER FORZATO */
    .site-title {
      font-family: 'MineCrafter', 'Minecraft', sans-serif !important;
      font-size: 2.3rem;
      color: #ffffff;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 3px 3px 0px #000000;
    }

    .site-subtitle {
      font-size: 0.9rem;
      color: #aaaaaa;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    /* MENU BOTTONI STILE MINECRAFT RETRO */
    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .mc-btn {
      display: block;
      width: 100%;
      background-color: #363636;
      color: #ffffff;
      text-decoration: none;
      padding: 13px 20px;
      font-size: 1rem;
      border-top: 2px solid #5a5a5a;
      border-left: 2px solid #5a5a5a;
      border-right: 2px solid #1e1e1e;
      border-bottom: 2px solid #1e1e1e;
      text-shadow: 2px 2px 0px #1a1a1a;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .mc-btn:hover {
      background-color: #4a5a75;
      border-top-color: #7c92b8;
      border-left-color: #7c92b8;
      color: #ffffa0;
    }

    .mc-btn:active {
      border-top: 2px solid #1e1e1e;
      border-left: 2px solid #1e1e1e;
      border-right: 2px solid #5a5a5a;
      border-bottom: 2px solid #5a5a5a;
    }

    /* RIGA DOPPIA PER ACCOUNT E OPTIONS */
    .menu-row {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 6px;
    }

    .menu-row .mc-btn {
      flex: 1;
    }

    .footer-note {
      margin-top: 26px;
      font-size: 0.75rem;
      color: #666666;
    }
  </style>
</head>
<body>

  <main class="hub-container">
    <img src="stonefilelogo.png" alt="StoneFiles Logo" class="logo-img" />
    
    <h1 class="site-title">STONEFILES</h1>
    <p class="site-subtitle">The Golden Era Minecraft Alpha & Beta Archive and Community.</p>

    <nav class="menu-buttons">
      <a href="announcements.html" class="mc-btn" style="color: #ffaa00;">Announcements</a>
      <a href="community.html" class="mc-btn">Community</a>
      <a href="archive.html" class="mc-btn">Version Archive</a>
      
      <div class="menu-row">
        <a href="account.html" class="mc-btn">Account</a>
        <a href="options.html" class="mc-btn">Options...</a>
      </div>
    </nav>

    <div class="footer-note">
      StoneFiles Project • Not affiliated with Mojang AB
    </div>
  </main>

</body>
</html>
