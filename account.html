<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoneFiles — Account</title>
  
  <style>
    /* RESET BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0px !important;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('sfondoindex.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px 16px;
    }

    /* BARRA IN ALTO */
    .top-bar {
      max-width: 750px;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: flex-between;
      align-items: center;
    }

    .btn-back {
      background-color: #1e1e1e;
      color: #ffffff;
      border: 1px solid #444444;
      padding: 6px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
    }

    .btn-back:hover {
      background-color: #2e2e2e;
    }

    /* CONTENITORE PRINCIPALE */
    .main-container {
      max-width: 750px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* BOX ACCOUNT */
    .account-box {
      background-color: rgba(30, 30, 30, 0.9);
      border: 1px solid #333333;
      padding: 30px 24px;
      text-align: center;
    }

    .account-box h1 {
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .account-box p {
      font-size: 0.95rem;
      color: #aaaaaa;
      margin-bottom: 24px;
    }

    .btn-auth {
      background-color: #3a3a3a;
      color: #ffffff;
      border: 1px solid #555555;
      padding: 10px 24px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-auth:hover {
      background-color: #4a4a4a;
    }
  </style>

  <!-- SDK FIREBASE (ES MODULES VIA CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Configurazione del tuo progetto Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDuu5Y88zLYuPWqxHs9pis6OfeNDKoG8YE",
      authDomain: "stonefiles-c2a40.firebaseapp.com",
      projectId: "stonefiles-c2a40",
      storageBucket: "stonefiles-c2a40.firebasestorage.app",
      messagingSenderId: "855521046414",
      appId: "1:855521046414:web:2996e4c8f2a6b47a72fedf",
      measurementId: "G-WEFNP7N7DG"
    };

    // Inizializzazione
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Gestione del bottone di Login con Google
    document.addEventListener("DOMContentLoaded", () => {
      const loginBtn = document.getElementById("login-google-btn");
      if (loginBtn) {
        loginBtn.addEventListener("click", async () => {
          try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            alert(`Benvenuto in StoneFiles, ${user.displayName}!`);
          } catch (error) {
            console.error("Errore di autenticazione:", error);
            alert("Errore durante l'accesso.");
          }
        });
      }
    });
  </script>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="btn-back">← Torna alla Home</a>
  </div>

  <div class="main-container">
    <main class="account-box">
      <h1>Account Area</h1>
      <p>Accedi per pubblicare post, votare e commentare su StoneFiles.</p>
      
      <button id="login-google-btn" class="btn-auth">Accedi con Google</button>
    </main>
  </div>

</body>
</html>
