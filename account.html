<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoneFiles — Account</title>
  <link rel="icon" type="image/png" href="stonefilelogo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#18202d">
  <script type="module" src="theme.js"></script>

  <style>
    @font-face {
      font-family: 'Minecraft';
      src: url('Minecraft.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'MineCrafter';
      src: url('Minecrafter.Alt.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0px !important;
      font-family: 'Minecraft', monospace, sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('sfondoindex.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    .account-container {
      background-color: rgba(24, 24, 24, 0.94);
      border-top: 2px solid #5a5a5a;
      border-left: 2px solid #5a5a5a;
      border-right: 2px solid #1e1e1e;
      border-bottom: 2px solid #1e1e1e;
      max-width: 480px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    .page-title {
      font-family: 'MineCrafter', 'Minecraft', sans-serif !important;
      font-size: 1.8rem;
      color: #ffffff;
      margin-bottom: 8px;
      text-shadow: 3px 3px 0px #000000;
    }

    .page-subtitle {
      font-size: 0.85rem;
      color: #aaaaaa;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #cccccc;
      margin-bottom: 4px;
    }

    .form-input {
      width: 100%;
      background-color: #121212;
      border: 2px solid #444444;
      color: #ffffff;
      padding: 12px;
      font-size: 0.95rem;
    }

    .form-input:focus {
      outline: none;
      border-color: #888888;
      background-color: #181818;
    }

    .mc-btn {
      display: block;
      width: 100%;
      background-color: #363636;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      border-top: 2px solid #5a5a5a;
      border-left: 2px solid #5a5a5a;
      border-right: 2px solid #1e1e1e;
      border-bottom: 2px solid #1e1e1e;
      text-shadow: 2px 2px 0px #1a1a1a;
      cursor: pointer;
      margin-top: 12px;
    }

    .mc-btn:hover {
      background-color: #4a5a75;
      border-top-color: #7c92b8;
      border-left-color: #7c92b8;
      color: #ffffa0;
    }

    .btn-danger {
      background-color: #4a1a1a;
      border-top-color: #7a2a2a;
      border-left-color: #7a2a2a;
      border-right-color: #2a0a0a;
      border-bottom-color: #2a0a0a;
      color: #ff6666;
    }

    .btn-danger:hover {
      background-color: #6a2222;
      color: #ffffff;
    }

    .status-msg {
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 20px;
    }

    #user-panel, #auth-panel {
      display: none;
    }
  </style>

  <script type="module">
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDuu5Y88zLYuPWqxHs9pis6OfeNDKoG8YE",
      authDomain: "stonefiles-c2a40.firebaseapp.com",
      projectId: "stonefiles-c2a40",
      storageBucket: "stonefiles-c2a40.firebasestorage.app",
      messagingSenderId: "855521046414",
      appId: "1:855521046414:web:2996e4c8f2a6b47a72fedf",
      measurementId: "G-WEFNP7N7DG"
    };

    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.addEventListener("DOMContentLoaded", () => {
      const authPanel = document.getElementById("auth-panel");
      const userPanel = document.getElementById("user-panel");
      const authForm = document.getElementById("auth-form");
      const formTitle = document.getElementById("form-title");
      const submitBtn = document.getElementById("submit-btn");
      const toggleMode = document.getElementById("toggle-mode");
      const nicknameGroup = document.getElementById("nickname-group");
      const statusMsg = document.getElementById("status-msg");
      
      const userEmailDisplay = document.getElementById("user-email-display");
      const userNicknameDisplay = document.getElementById("user-nickname-display");
      const logoutBtn = document.getElementById("logout-btn");

      let isSignUp = false;

      toggleMode.addEventListener("click", (e) => {
        e.preventDefault();
        isSignUp = !isSignUp;
        if (isSignUp) {
          formTitle.textContent = "Register Account";
          submitBtn.textContent = "Sign Up";
          toggleMode.textContent = "Already have an account? Log in";
          nicknameGroup.style.display = "block";
        } else {
          formTitle.textContent = "Account Login";
          submitBtn.textContent = "Log In";
          toggleMode.textContent = "Need an account? Register";
          nicknameGroup.style.display = "none";
        }
      });

      authForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email-input").value.trim();
        const password = document.getElementById("password-input").value.trim();
        const nickname = document.getElementById("nickname-input").value.trim();

        statusMsg.style.color = "#ffff55";
        statusMsg.textContent = "Processing...";

        try {
          if (isSignUp) {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            if (nickname) {
              await updateProfile(userCredential.user, { displayName: nickname });
            }
            statusMsg.style.color = "#55ff55";
            statusMsg.textContent = "Registration successful!";
          } else {
            await signInWithEmailAndPassword(auth, email, password);
            statusMsg.style.color = "#55ff55";
            statusMsg.textContent = "Logged in successfully!";
          }
        } catch (error) {
          statusMsg.style.color = "#ff5555";
          statusMsg.textContent = error.message;
        }
      });

      logoutBtn.addEventListener("click", async () => {
        await signOut(auth);
        statusMsg.textContent = "Logged out.";
      });

      onAuthStateChanged(auth, (user) => {
        if (user) {
          authPanel.style.display = "none";
          userPanel.style.display = "block";
          userEmailDisplay.textContent = user.email || "No email";
          userNicknameDisplay.textContent = user.displayName || "Not set";
        } else {
          authPanel.style.display = "block";
          userPanel.style.display = "none";
        }
      });
    });
  </script>
</head>
<body>

  <main class="account-container">
    <h1 class="page-title">Account</h1>
    <p class="page-subtitle">Manage your credentials and sync settings.</p>

    <!-- AUTH PANEL (Login / Register) -->
    <div id="auth-panel">
      <h3 id="form-title" style="color: #fff; margin-bottom: 14px; font-size: 1.1rem;">Account Login</h3>
      <form id="auth-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email-input" class="form-input" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password-input" class="form-input" required />
        </div>
        <div class="form-group" id="nickname-group" style="display: none;">
          <label>Nickname</label>
          <input type="text" id="nickname-input" class="form-input" placeholder="Your display name" />
        </div>
        <button type="submit" id="submit-btn" class="mc-btn">Log In</button>
      </form>
      <p style="margin-top: 14px;">
        <a href="#" id="toggle-mode" style="color: #ffaa00; font-size: 0.85rem; text-decoration: none;">Need an account? Register</a>
      </p>
    </div>

    <!-- USER PANEL (Logged In) -->
    <div id="user-panel">
      <p style="color: #ccc; font-size: 0.9rem; margin-bottom: 8px;">Logged in as:</p>
      <p id="user-email-display" style="color: #ffaa00; font-weight: bold; margin-bottom: 12px;"></p>
      <p style="color: #ccc; font-size: 0.9rem; margin-bottom: 4px;">Nickname:</p>
      <p id="user-nickname-display" style="color: #fff; font-weight: bold; margin-bottom: 20px;"></p>
      
      <button id="logout-btn" class="mc-btn btn-danger">Log Out</button>
    </div>

    <p id="status-msg" class="status-msg"></p>

    <a href="index.html" class="mc-btn" style="margin-top: 20px;">← Main Menu</a>
  </main>

</body>
</html>
